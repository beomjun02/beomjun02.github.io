<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily News — Admin</title>
<link rel="stylesheet" href="/stylesheet.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/earlyaccess/notosanskr.css">
<style>
.admin { max-width: 760px; margin: 2em auto; padding: 0 1.2em; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', sans-serif; }
.admin h1 { font-size: 1.6em; margin-bottom: 0.3em; }
.admin .page-meta { color: #888; font-size: 0.85em; margin-bottom: 1.5em; }
.admin a { color: inherit; }
.admin a:hover { color: #f09228; }

/* Tabs */
.admin input[name="tab"] { display: none; }
.admin .tab-bar { display: flex; gap: 0; border-bottom: 2px solid #eee; margin-bottom: 1.5em; }
.admin .tab-bar label { padding: 0.5em 1.2em; font-size: 0.95em; font-weight: 600; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -2px; color: #888; transition: color 0.15s, border-color 0.15s; }
.admin .tab-bar label:hover { color: #d4a017; }
.admin #tab-report:checked ~ .tab-bar label[for="tab-report"],
.admin #tab-devlog:checked ~ .tab-bar label[for="tab-devlog"],
.admin #tab-sandbox:checked ~ .tab-bar label[for="tab-sandbox"] { color: #d4a017; border-bottom-color: #d4a017; }
.admin .tab-content { display: none; }
.admin #tab-report:checked ~ .panel-report,
.admin #tab-devlog:checked ~ .panel-devlog,
.admin #tab-sandbox:checked ~ .panel-sandbox { display: block; }

/* Report styles */
.admin h2 { font-size: 1.15em; margin-top: 1.8em; border-bottom: 1px solid #ddd; padding-bottom: 0.3em; }
.admin .report-table { width: 100%; border-collapse: collapse; font-size: 0.9em; margin: 1em 0; }
.admin .report-table th, .admin .report-table td { padding: 0.5em 0.7em; border-bottom: 1px solid #ddd; text-align: left; }
.admin .report-table th { font-weight: 600; }
.admin .ok { color: #4caf50; }
.admin .err { color: #f44336; }
.admin .none { color: #888; font-style: italic; }

/* Devlog styles */
.admin .entry { margin-bottom: 0.5em; border-bottom: 1px solid #eee; }
.admin .entry[open] { margin-bottom: 2em; padding-bottom: 1.5em; }
.admin .entry:last-child { border-bottom: none; }
.admin .entry-title { font-size: 1.1em; font-weight: 600; padding: 0.5em 0; cursor: pointer; list-style: none; }
.admin .entry-title::-webkit-details-marker { display: none; }
.admin .entry-title:hover { color: #d4a017; }
.admin .entry-meta { font-size: 0.75em; font-weight: 400; display: block; margin-top: 0.1em; }
.admin .entry-date { color: #888; }
.admin .entry-type { color: #d4a017; font-weight: 600; margin-left: 0.5em; }
.admin .entry-body h2 { font-size: 1.05em; margin-top: 1.3em; border-bottom: 1px solid #eee; padding-bottom: 0.2em; }
.admin .entry-body h3 { font-size: 0.95em; margin-top: 1em; }
.admin .entry-body p { margin: 0.6em 0; line-height: 1.6; }
.admin .entry-body ul, .admin .entry-body ol { padding-left: 1.5em; margin: 0.5em 0; }
.admin .entry-body li { margin-bottom: 0.3em; line-height: 1.5; }
.admin .entry-body code { background: #f5f5f5; padding: 0.15em 0.4em; border-radius: 3px; font-size: 0.9em; }
.admin .entry-body pre { background: #f5f5f5; padding: 0.8em 1em; border-radius: 4px; overflow-x: auto; font-size: 0.85em; line-height: 1.4; }
.admin .entry-body pre code { background: none; padding: 0; }
.admin .entry-body table { border-collapse: collapse; margin: 0.5em 0; font-size: 0.9em; }
.admin .entry-body th, .admin .entry-body td { border: 1px solid #ddd; padding: 0.35em 0.6em; text-align: left; }
.admin .entry-body th { background: #f9f9f9; font-weight: 600; }
.admin .entry-body blockquote { border-left: 3px solid #d4a017; margin: 0.5em 0; padding: 0.3em 1em; color: #666; }

/* Sandbox styles */
.admin .sandbox-area { display: flex; flex-direction: column; gap: 1em; }
.admin .sandbox-editor { width: 100%; min-height: 200px; border: 1px solid #aaa; border-radius: 4px; padding: 0.8em; font-family: 'SF Mono', 'Fira Code', monospace; font-size: 0.85em; line-height: 1.5; resize: vertical; box-sizing: border-box; }
.admin .sandbox-controls { display: flex; gap: 0.6em; align-items: center; }
.admin .sandbox-btn { background: #333; color: #fff; border: none; border-radius: 4px; padding: 0.4em 1em; font-size: 0.9em; font-family: inherit; cursor: pointer; }
.admin .sandbox-btn:hover { background: #555; }
.admin .sandbox-btn.outline { background: none; color: inherit; border: 1px solid #aaa; }
.admin .sandbox-btn.outline:hover { border-color: #d4a017; color: #d4a017; }
.admin .sandbox-preview { border: 1px solid #ddd; border-radius: 4px; padding: 1.2em; min-height: 100px; }
.admin .sandbox-label { font-size: 0.85em; color: #888; margin-bottom: 0.3em; }

/* Dark mode */
@media (prefers-color-scheme: dark) {
  .admin { color: #f0f0f0; }
  .admin h1 { color: #f5f5f5; }
  .admin h2 { color: #f0f0f0; border-bottom-color: #444; }
  .admin .page-meta { color: #aaa; }
  .admin .tabs { border-bottom-color: #333; }
  .admin .tabs label { color: #888; }
  .admin a { color: #64b5f6; }
  .admin a:hover { color: #f09228; }
  .admin .report-table th, .admin .report-table td { border-bottom-color: #444; }
  .admin .entry { border-bottom-color: #333; }
  .admin .entry-body h2 { border-bottom-color: #444; }
  .admin .entry-body code { background: #2a2a2a; }
  .admin .entry-body pre { background: #1a1a1a; }
  .admin .entry-body th { background: #2a2a2a; }
  .admin .entry-body th, .admin .entry-body td { border-color: #444; }
  .admin .entry-body blockquote { color: #aaa; }
  .admin .sandbox-editor { background: #1a1a1a; color: #f0f0f0; border-color: #555; }
  .admin .sandbox-preview { border-color: #444; }
  .admin .sandbox-btn { background: #555; }
  .admin .sandbox-btn.outline { border-color: #555; color: #ccc; }
}
</style>
</head>
<body>
<div class="admin">
<h1>Daily News — Admin</h1>
<p class="page-meta"><a href="../">← all users</a> · <a href="../report/">report</a> · <a href="../devlog/">devlog</a> · <a href="../dev/">dev</a></p>

<input type="radio" name="tab" id="tab-report" checked>
<input type="radio" name="tab" id="tab-devlog">
<input type="radio" name="tab" id="tab-sandbox">

<div class="tab-bar">
<label for="tab-report">Report</label>
<label for="tab-devlog">Dev Log</label>
<label for="tab-sandbox">Sandbox</label>
</div>

<div class="tab-content panel-report">
<!-- REPORT-START -->
<p class="none">No report data yet. Run <code>generate_report.py</code> to populate.</p>
<!-- REPORT-END -->
</div>

<div class="tab-content panel-devlog">
<!-- DEVLOG-START -->
<p class="none">No devlog data yet. Run <code>publish_devlog.py</code> to populate.</p>
<!-- DEVLOG-END -->
</div>

<div class="tab-content panel-sandbox">
<div class="sandbox-area">
<div class="sandbox-label">HTML / CSS</div>
<textarea class="sandbox-editor" placeholder="Paste HTML + inline CSS here to preview...">&lt;div class="daily-news" style="max-width:760px"&gt;
  &lt;h2&gt;Example Section&lt;/h2&gt;
  &lt;ul&gt;
    &lt;li&gt;
      &lt;div class="item-row"&gt;
        &lt;span class="item-title"&gt;&lt;a href="#"&gt;Sample news item&lt;/a&gt;&lt;/span&gt;
      &lt;/div&gt;
      &lt;span class="item-meta"&gt;Source &amp;middot; 2026-05-31&lt;/span&gt;
      &lt;span class="item-desc"&gt;Description text goes here.&lt;/span&gt;
    &lt;/li&gt;
  &lt;/ul&gt;
&lt;/div&gt;</textarea>
<div class="sandbox-controls">
<button class="sandbox-btn" onclick="renderPreview()">Render</button>
<button class="sandbox-btn outline" onclick="clearPreview()">Clear</button>
</div>
<div class="sandbox-label">Preview</div>
<div class="sandbox-preview" id="sandbox-out"></div>
</div>
</div>

</div>

<script>
function renderPreview(){
  var src=document.querySelector('.sandbox-editor').value;
  document.getElementById('sandbox-out').innerHTML=src;
}
function clearPreview(){
  document.querySelector('.sandbox-editor').value='';
  document.getElementById('sandbox-out').innerHTML='';
}
</script>
</body>
</html>
