<svg viewBox="0 0 1180 300" width="1180" height="300" xmlns="http://www.w3.org/2000/svg" font-family="Calibri, Carlito, 'Source Sans 3', Arial, sans-serif" font-size="13">
<style>svg{--txt:#000000;--mut:#595959;--mut2:#8a8f98;--acc:#0070C0;--title:#0070C0;--line:#d5d9e0;--panel:#f5f7fa;--panel2:#eef1f6;--acc-bg:#e8f2fb;--acc-line:#9dc7ea}</style>
<style>.t{fill:var(--txt)}.m{fill:var(--mut)}.b{font-weight:600}</style>
<text x="18" y="24" class="t b">D1  patch · full attention</text>
<text x="18" y="44" class="m">2,560 tokens</text>
<rect x="20" y="58" width="156" height="156" fill="var(--acc)" opacity="0.30"/>
<rect x="20" y="58" width="156" height="156" fill="none" stroke="var(--line)"/>
<text x="20" y="232" class="m">attention mask over tokens</text>
<text x="405" y="24" class="t b">D2  point · PTv3 windows</text>
<text x="405" y="44" class="m">20,480 tokens</text>
<rect x="407" y="58" width="39" height="39" fill="var(--acc)" opacity="0.30"/>
<rect x="446" y="97" width="39" height="39" fill="var(--acc)" opacity="0.30"/>
<rect x="485" y="136" width="39" height="39" fill="var(--acc)" opacity="0.30"/>
<rect x="524" y="175" width="39" height="39" fill="var(--acc)" opacity="0.30"/>
<rect x="407" y="58" width="156" height="156" fill="none" stroke="var(--line)"/>
<text x="407" y="232" class="m">attention mask over tokens</text>
<text x="792" y="24" class="t b">D3  = D1 + SVD conditioning</text>
<text x="792" y="44" class="m">2,560 tokens</text>
<rect x="794" y="58" width="156" height="156" fill="var(--acc)" opacity="0.30"/>
<rect x="794" y="58" width="156" height="156" fill="none" stroke="var(--line)"/>
<text x="794" y="232" class="m">attention mask over tokens</text>
<text x="18" y="286" class="t">tests: is the faithful structure enough?</text>
<text x="405" y="286" class="t">tests: does proximity-based locality help?</text>
<text x="792" y="286" class="t">tests: can the model be told how much to move?</text>
</svg>