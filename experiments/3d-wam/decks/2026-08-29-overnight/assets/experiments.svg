<text x="18" y="222" class="b t">what it borrows</text>
<text x="18" y="240" class="t">Wan · patch embed + full 3-D attention</text>
<text x="18" y="257" class="m">the video-generation contract, unchanged</text>
<text x="405" y="240" class="t">PTv3 · serialized window attention</text>
<text x="405" y="257" class="m">locality without spending tokens</text>
<text x="792" y="240" class="t">MolmoMotion · the ordering bias of its AR head</text>
<text x="792" y="257" class="m">their AR variant beat their own flow matching</text>
<line x1="18" y1="272" x2="1162" y2="272" stroke="var(--line)"/>
<text x="18" y="286" class="b t">if it works we should see</text>
<text x="18" y="304" class="t">motion near 100 %, ADE under both baselines</text>
<text x="18" y="321" class="m">→ meaning: structure alone was the problem</text>
<text x="405" y="304" class="t">objects far from hands stop drifting</text>
<text x="405" y="321" class="m">→ meaning: the model lacked access to proximity</text>
<text x="792" y="304" class="t">smoother trajectories, less late-step drift</text>
<text x="792" y="321" class="m">→ meaning: the missing bias was causality, not capacity</text>
<text x="18" y="347" class="lb">all three: same data, same loss (masked MSE only), ~120 M parameters, ~3 h each · purple = hand points, orange = object points</text>
