const d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open(k){const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:d(I)},k,d(C));const h=new TextDecoder().decode(pt);document.open();document.write(h);document.close();const t=h.split("<title>")[1];if(t)document.title=t.split("<"+"/title>")[0];}
async function derive(p){const b=await crypto.subtle.importKey("raw",new TextEncoder().encode(p),"PBKDF2",false,["deriveKey"]);return crypto.subtle.deriveKey({name:"PBKDF2",salt:d(S),iterations:N,hash:"SHA-256"},b,{name:"AES-GCM",length:256},true,["decrypt"]);}
function ask(){const f=document.getElementById("f");f.hidden=false;document.getElementById("p").focus();}
(async()=>{let s=null;try{s=localStorage.getItem("xk")}catch(e){}
if(!s)return ask();try{const k=await crypto.subtle.importKey("raw",d(s),"AES-GCM",false,["decrypt"]);await open(k);}catch(e){try{localStorage.removeItem("xk")}catch(_){}ask();}})();
document.getElementById("f").onsubmit=async ev=>{ev.preventDefault();const e=document.getElementById("e");e.textContent="";
try{const k=await derive(document.getElementById("p").value);await crypto.subtle.decrypt({name:"AES-GCM",iv:d(I)},k,d(C));
try{const raw=new Uint8Array(await crypto.subtle.exportKey("raw",k));localStorage.setItem("xk",btoa(String.fromCharCode(...raw)))}catch(_){}
await open(k);}catch(x){e.textContent="Wrong password.";}};
