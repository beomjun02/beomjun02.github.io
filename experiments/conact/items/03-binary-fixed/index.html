async function derive(p){const b=await crypto.subtle.importKey("raw",new TextEncoder().encode(p),"PBKDF2",false,["deriveKey"]);return crypto.subtle.deriveKey({name:"PBKDF2",salt:d(S),iterations:N,hash:"SHA-256"},b,{name:"AES-GCM",length:256},true,["decrypt"]);}
function ask(){const f=document.getElementById("f");f.hidden=false;document.getElementById("p").focus();}

if(!s)return ask();try{const k=await crypto.subtle.importKey("raw",d(s),"AES-GCM",false,["decrypt"]);await open(k);}catch(e){try{localStorage.removeItem("xk")}catch(_){}ask();}})();

await open(k);}catch(x){e.textContent="Wrong password.";}};
