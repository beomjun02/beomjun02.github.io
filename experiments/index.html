@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171716;--fg:#ecebe7;--muted:#a3a19b;--line:#3a3936;--card:#1f1f1d;--accent:#8fb4dc;--err:#f0a091}}

*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--fg);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:16px}

label{display:flex;gap:6px;align-items:center;margin:10px 0 14px;color:var(--muted);font-size:13px}
button{width:100%;font:inherit;padding:8px;border:0;border-radius:6px;background:var(--accent);color:var(--bg);cursor:pointer}
#e{color:var(--err);font-size:13px;min-height:1.2em;margin:8px 0 0}
