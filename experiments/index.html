form{width:100%;max-width:300px;display:flex;flex-direction:column;gap:10px}form[hidden]{display:none}

button{width:100%;font:inherit;padding:8px;border:0;border-radius:6px;background:var(--accent);color:var(--bg);cursor:pointer}
#e{color:var(--err);font-size:13px;min-height:1.2em;margin:8px 0 0}
